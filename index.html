<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Bistro & Bar - Meni</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-28">

    <!-- Skriveni iframe i forma za slanje u Google Forms bez blokade -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){onOrderSuccess();}"></iframe>
    
    <form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSeLlIjcNZ_uoxTLpB6oOiFDEJfF7KOBYVrQF8Iqd80pSo0XRw/formResponse" method="POST" target="hidden_iframe" class="hidden">
        <input type="text" name="entry.1058901983" id="input_masa">
        <input type="text" name="entry.1928541526" id="input_naracki">
        <input type="text" name="entry.270385887" id="input_vkupno">
    </form>

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-amber-500">Aroma Bistro & Bar</h1>
                <p id="table-display" class="text-xs text-gray-300">Маса: 1</p>
            </div>
            <button onclick="toggleCart()" class="relative bg-amber-500 text-slate-900 font-bold px-3 py-2 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count-header" class="bg-slate-900 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-md mx-auto p-4">
        <!-- Categories -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-2 no-scrollbar">
            <button onclick="filterCategory('all')" class="bg-amber-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">Сите</button>
            <button onclick="filterCategory('pijaoci')" class="bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap border">Пијалоци</button>
            <button onclick="filterCategory('hrana')" class="bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap border">Храна</button>
            <button onclick="filterCategory('deserti')" class="bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap border">Десерти</button>
        </div>

        <!-- Menu Items Grid -->
        <div id="menu-container" class="grid grid-cols-1 gap-4">
            <!-- Items generated here -->
        </div>
    </main>

    <!-- Floating Green "НАРАЧАЈ" Button (Bottom Right) -->
    <button onclick="toggleCart()" class="fixed bottom-6 right-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 rounded-full shadow-2xl flex items-center gap-3 z-40 border-2 border-white active:scale-95 transition">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span>НАРАЧАЈ</span>
        <span id="floating-cart-badge" class="bg-white text-green-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
    </button>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end flex-col">
        <div class="bg-white rounded-t-2xl p-4 max-w-md w-full mx-auto max-h-[80vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-slate-900">Вашата нарачка</h2>
                <button onclick="toggleCart()" class="text-gray-500 text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="overflow-y-auto py-4 flex-1 divide-y">
                <!-- Cart items list -->
            </div>

            <div class="border-t pt-3">
                <div class="flex justify-between font-bold text-lg mb-4 text-slate-900">
                    <span>Вкупно:</span>
                    <span id="cart-total">0 ден.</span>
                </div>
                <button id="send-order-btn" onclick="submitOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> ПОТВРДИ И НАРАЧАЈ
                </button>
            </div>
        </div>
    </div>

    <script>
        let submitted = false;

        // Lista artikala sa opcijom za sliku (img)
        const menuItems = [
            { id: 1, name: "Еспресо", price: 80, cat: "pijaoci", img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=150&auto=format&fit=crop&q=60" },
            { id: 2, name: "Капучино", price: 100, cat: "pijaoci", img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=150&auto=format&fit=crop&q=60" },
            { id: 3, name: "Кока Кола 0.25", price: 110, cat: "pijaoci", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=150&auto=format&fit=crop&q=60" },
            { id: 4, name: "Цеден Портокал", price: 140, cat: "pijaoci", img: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=150&auto=format&fit=crop&q=60" },
            { id: 5, name: "Пица Капричоза", price: 320, cat: "hrana", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150&auto=format&fit=crop&q=60" },
            { id: 6, name: "Арома Бургер", price: 280, cat: "hrana", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150&auto=format&fit=crop&q=60" },
            { id: 7, name: "Палачинка со Nutella", price: 160, cat: "deserti", img: "https://images.unsplash.com/photo-1519676867240-f03562e64548?w=150&auto=format&fit=crop&q=60" }
        ];

        let cart = [];
        let currentTable = "1";

        function getTableNumber() {
            const params = new URLSearchParams(window.location.search);
            const sto = params.get('sto') || params.get('table') || params.get('masa');
            if (sto) currentTable = sto;
            document.getElementById('table-display').innerText = "Маса: " + currentTable;
        }

        function renderMenu(category = 'all') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const filtered = category === 'all' 
                ? menuItems 
                : menuItems.filter(item => item.cat === category);

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg bg-gray-100 flex-shrink-0">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">${item.name}</h3>
                                <p class="text-amber-600 font-semibold text-xs mt-0.5">${item.price} ден.</p>
                            </div>
                        </div>
                        <button onclick="addToCart(${item.id})" class="bg-slate-900 hover:bg-slate-800 text-white w-9 h-9 rounded-lg font-bold flex items-center justify-center active:scale-95 transition flex-shrink-0">
                            +
                        </button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            renderMenu(cat);
        }

        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            const inCart = cart.find(i => i.id === id);

            if (inCart) {
                inCart.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((acc, curr) => acc + curr.qty, 0);
            const totalPrice = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            document.getElementById('cart-count-header').innerText = totalItems;
            document.getElementById('floating-cart-badge').innerText = totalItems;
            document.getElementById('cart-total').innerText = totalPrice + " ден.";

            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-gray-400 text-center py-6">Кошничката е празна</p>';
                return;
            }

            cart.forEach(item => {
                cartItems.innerHTML += `
                    <div class="flex justify-between items-center py-2">
                        <div>
                            <p class="font-semibold text-slate-800">${item.name}</p>
                            <p class="text-xs text-gray-500">${item.price} ден. x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, -1)" class="bg-gray-200 px-2.5 py-1 rounded font-bold text-sm">-</button>
                            <span class="font-semibold text-sm px-1">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="bg-gray-200 px-2.5 py-1 rounded font-bold text-sm">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function submitOrder() {
            if (cart.length === 0) return alert("Кошничката е празна!");

            const btn = document.getElementById('send-order-btn');
            btn.disabled = true;
            btn.innerText = "Се испраќа...";

            const narackiString = cart.map(i => `${i.name} x${i.qty}`).join(", ");
            const totalSum = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0) + " ден.";

            // Popunjavamo skrivenu formi
            document.getElementById('input_masa').value = currentTable;
            document.getElementById('input_naracki').value = narackiString;
            document.getElementById('input_vkupno').value = totalSum;

            submitted = true;
            document.getElementById('gform').submit();
        }

        function onOrderSuccess() {
            alert("Нарачката е успешно испратена!");
            cart = [];
            updateCartUI();
            toggleCart();
            const btn = document.getElementById('send-order-btn');
            btn.disabled = false;
            btn.innerText = "ПОТВРДИ И НАРАЧАЈ";
            submitted = false;
        }

        getTableNumber();
        renderMenu();
    </script>
</body>
</html>
