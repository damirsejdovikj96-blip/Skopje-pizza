<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Bistro & Bar - Meni</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-28">

    <!-- Zaglavlje / Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-amber-400">Aroma Bistro & Bar</h1>
                <p class="text-xs text-gray-400">Дигитално мени</p>
            </div>
            <!-- Dugmići za jezik -->
            <div class="flex gap-1 text-xs font-semibold">
                <button onclick="setLanguage('mk')" id="btn-mk" class="px-2 py-1 rounded bg-amber-500 text-black">MK</button>
                <button onclick="setLanguage('en')" id="btn-en" class="px-2 py-1 rounded bg-slate-800 text-gray-300">EN</button>
                <button onclick="setLanguage('sq')" id="btn-sq" class="px-2 py-1 rounded bg-slate-800 text-gray-300">SQ</button>
            </div>
        </div>
    </header>

    <!-- Prikaz kategorija i artikala -->
    <main class="max-w-md mx-auto px-4 pt-4">
        
        <!-- Kategorije nav -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1" id="categories-container">
            <!-- Kategorije se ubacuju dinamički -->
        </div>

        <!-- Lista artikala -->
        <div id="menu-items" class="flex flex-col gap-3">
            <!-- Artikli se ubacuju dinamički -->
        </div>

    </main>

    <!-- Plutajući bar za narudžbinu na dnu -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50 hidden">
        <div class="max-w-md mx-auto p-4 flex items-center justify-between">
            <!-- Levo: Brojač narudžbina na makedonskom -->
            <div class="flex items-center gap-3">
                <div class="relative">
                    <i class="fa-solid fa-utensils text-2xl text-amber-500"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-500" id="txt-naracki-label">Нарачки:</p>
                    <p class="text-lg font-bold text-gray-900" id="cart-total">0 ден.</p>
                </div>
            </div>
            <!-- Desno: Dugme za potvrdu -->
            <button onclick="openCartModal()" id="btn-view-order" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2.5 rounded-xl text-sm transition">
                Преглед на нарачка
            </button>
        </div>
    </div>

    <!-- Modal za pregled narudžbine -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-5 max-h-[85vh] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold" id="modal-title">Вашата нарачка</h2>
                    <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                </div>
                <!-- Lista izabranih artikala -->
                <div id="cart-list" class="flex flex-col gap-3 max-h-60 overflow-y-auto pr-1">
                    <!-- Dinamički naručene stavke -->
                </div>
            </div>

            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-700" id="modal-total-label">Вкупно:</span>
                    <span class="text-xl font-extrabold text-amber-600" id="modal-total-sum">0 ден.</span>
                </div>
                <button onclick="submitOrder()" id="send-order-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition text-center">
                    <span id="btn-confirm-text">ПОТВРДИ И НАРАЧАЈ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Skrivena Google Forma sa iframe-om za slanje bez osvežavanja -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){onOrderSuccess();}"></iframe>
    
    <form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSeLlIjcNZ_uoxTLpB6oOiFDEJfF7KOBYVrQF8Iqd80pSo0XRw/formResponse" method="POST" target="hidden_iframe" class="hidden">
        <input type="text" name="entry.1058901983" id="input_vreme">
        <input type="text" name="entry.270385887" id="input_naracki">
        <input type="text" name="entry.1928541526" id="input_vkupno">
    </form>

    <script>
        // Meni Podaci
        const menuData = [
            { id: 1, cat: 'pizzas', name: { mk: 'Маргарита', en: 'Margherita', sq: 'Margherita' }, price: 320, img: 'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=300' },
            { id: 2, cat: 'pizzas', name: { mk: 'Капричоза', en: 'Capricciosa', sq: 'Capricciosa' }, price: 380, img: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=300' },
            { id: 3, cat: 'drinks', name: { mk: 'Кока Кола 0.33l', en: 'Coca Cola 0.33l', sq: 'Coca Cola 0.33l' }, price: 110, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' },
            { id: 4, cat: 'drinks', name: { mk: 'Еспресо', en: 'Espresso', sq: 'Espresso' }, price: 80, img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300' }
        ];

        const translations = {
            mk: {
                categories: { pizzas: 'Пици', drinks: 'Пијалоци' },
                narackiLabel: 'Нарачки:',
                viewOrder: 'Преглед на нарачка',
                modalTitle: 'Вашата нарачка',
                totalLabel: 'Вкупно:',
                btnConfirm: 'ПОТВРДИ И НАРАЧАЈ',
                sending: 'Се испраќа...',
                successMsg: 'Вашата нарачка е успешно испратена!',
                emptyCart: 'Вашата кошничка е празна!'
            },
            en: {
                categories: { pizzas: 'Pizzas', drinks: 'Drinks' },
                narackiLabel: 'Orders:',
                viewOrder: 'View Order',
                modalTitle: 'Your Order',
                totalLabel: 'Total:',
                btnConfirm: 'CONFIRM & ORDER',
                sending: 'Sending...',
                successMsg: 'Your order has been sent successfully!',
                emptyCart: 'Your cart is empty!'
            },
            sq: {
                categories: { pizzas: 'Picat', drinks: 'Pijet' },
                narackiLabel: 'Porositë:',
                viewOrder: 'Shiko porosinë',
                modalTitle: 'Porosia juaj',
                totalLabel: 'Totali:',
                btnConfirm: 'KONFIRMO & POROSIT',
                sending: 'Duke dërguar...',
                successMsg: 'Porosia juaj u dërgua me sukses!',
                emptyCart: 'Shporta juaj është bosh!'
            }
        };

        let currentLang = 'mk';
        let activeCategory = 'pizzas';
        let cart = [];
        let submitted = false;

        // Automatska detekcija jezika
        function initLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('sq')) currentLang = 'sq';
            else if (userLang.startsWith('en')) currentLang = 'en';
            else currentLang = 'mk';
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            currentLang = lang;
            ['mk', 'en', 'sq'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = 'px-2 py-1 rounded bg-amber-500 text-black font-bold';
                } else {
                    btn.className = 'px-2 py-1 rounded bg-slate-800 text-gray-300';
                }
            });

            const t = translations[currentLang];
            document.getElementById('txt-naracki-label').innerText = t.narackiLabel;
            document.getElementById('btn-view-order').innerText = t.viewOrder;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('modal-total-label').innerText = t.totalLabel;
            document.getElementById('btn-confirm-text').innerText = t.btnConfirm;

            renderCategories();
            renderMenuItems();
            updateCartUI();
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const cats = ['pizzas', 'drinks'];
            const t = translations[currentLang];

            container.innerHTML = cats.map(cat => `
                <button onclick="switchCategory('${cat}')" class="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition ${activeCategory === cat ? 'bg-amber-500 text-slate-900 shadow' : 'bg-white text-gray-600 border'}">
                    ${t.categories[cat]}
                </button>
            `).join('');
        }

        function switchCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenuItems();
        }

        function renderMenuItems() {
            const container = document.getElementById('menu-items');
            const items = menuData.filter(i => i.cat === activeCategory);

            container.innerHTML = items.map(item => {
                const cartItem = cart.find(c => c.id === item.id);
                const qty = cartItem ? cartItem.qty : 0;

                return `
                    <div class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between border border-gray-100">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" class="w-16 h-16 rounded-lg object-cover">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${item.name[currentLang] || item.name['mk']}</h3>
                                <p class="text-amber-600 font-extrabold text-sm">${item.price} ден.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${qty > 0 ? `
                                <button onclick="changeQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-gray-200 text-gray-700 font-bold flex items-center justify-center">-</button>
                                <span class="font-bold text-sm w-4 text-center">${qty}</span>
                            ` : ''}
                            <button onclick="changeQty(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-amber-500 text-slate-900 font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeQty(id, change) {
            const item = menuData.find(i => i.id === id);
            let cartItem = cart.find(c => c.id === id);

            if (cartItem) {
                cartItem.qty += change;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            } else if (change > 0) {
                cart.push({ ...item, qty: 1 });
            }

            renderMenuItems();
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((acc, curr) => acc + curr.qty, 0);
            const totalSum = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const cartBar = document.getElementById('cart-bar');
            if (totalQty > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
                closeCartModal();
            }

            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total').innerText = `${totalSum} ден.`;
            document.getElementById('modal-total-sum').innerText = `${totalSum} ден.`;

            // Modal lista
            const modalList = document.getElementById('cart-list');
            modalList.innerHTML = cart.map(i => `
                <div class="flex justify-between items-center text-sm border-b pb-2">
                    <div>
                        <p class="font-bold text-gray-800">${i.name[currentLang] || i.name['mk']}</p>
                        <p class="text-xs text-gray-500">${i.price} ден. x ${i.qty}</p>
                    </div>
                    <span class="font-bold text-amber-600">${i.price * i.qty} ден.</span>
                </div>
            `).join('');
        }

        function openCartModal() { document.getElementById('cart-modal').classList.remove('hidden'); }
        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }

        function submitOrder() {
            const t = translations[currentLang];
            if (cart.length === 0) return alert(t.emptyCart);

            const btn = document.getElementById('send-order-btn');
            btn.disabled = true;
            document.getElementById('btn-confirm-text').innerText = t.sending;

            // Vreme HH:MM
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            const narackiString = cart.map(i => `${i.name['mk']} x${i.qty}`).join(", ");
            const totalSum = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0) + " ден.";

            // Popunjavanje skrivenih inputa
            document.getElementById('input_vreme').value = currentTime;
            document.getElementById('input_naracki').value = narackiString;
            document.getElementById('input_vkupno').value = totalSum;

            submitted = true;
            document.getElementById('gform').submit();
        }

        function onOrderSuccess() {
            const t = translations[currentLang];
            alert(t.successMsg);
            cart = [];
            submitted = false;
            document.getElementById('send-order-btn').disabled = false;
            document.getElementById('btn-confirm-text').innerText = t.btnConfirm;
            closeCartModal();
            renderMenuItems();
            updateCartUI();
        }

        window.onload = initLanguage;
    </script>
</body>
</html>
